{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <!-- LOGIN CSS -->
    <link rel="stylesheet" href="{% static 'CSS/admin/login.css' %}" />
    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <!--  =====================================
             LOGO
        ======================================  -->

      <img src="{% static 'image/logo.png' %}" class="login-logo" alt="Sungreen Logo" />

      <!--  =====================================
             TITLE
        ======================================  -->

      <h2>Admin Login</h2>

      <!--  =====================================
             LOGIN FORM
        ======================================  -->

      <form method="POST">
        {% csrf_token %}

        <!-- USERNAME -->

        <div class="input-box">
          <i class="bi bi-person"></i>

          <input type="text" name="username" placeholder="Username" autocomplete="username" required />
        </div>

        <!-- PASSWORD -->

        <div class="input-box password-box">
          <i class="bi bi-lock"></i>

          <input type="password" name="password" id="password" placeholder="Password" autocomplete="current-password" required />

          <!-- PASSWORD SHOW / HIDE -->

          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>

        <!--  =====================================
                 FORGOT PASSWORD
            ======================================  -->

        <div class="forgot-password">
          <a href="{% url 'admin_forgot_password' %}">
            <i class="bi bi-key"></i>

            <span>Forgot Password?</span>
          </a>
        </div>

        <!--  =====================================
                 LOGIN BUTTON
            ======================================  -->

        <button type="submit">
          <i class="bi bi-box-arrow-in-right"></i>

          <span>Login</span>
        </button>
      </form>

      <!--  =====================================
             ERROR MESSAGE
        ======================================  -->

      {% if error %}
        <p class="error">
          <i class="bi bi-exclamation-circle"></i>

          {{ error }}
        </p>
      {% endif %}

      <!--  =====================================
             VIEW WEBSITE
        ======================================  -->

      <a href="/" class="view-site">
        <i class="bi bi-globe2"></i>

        <span>View Website</span>

        <i class="bi bi-arrow-up-right arrow-icon"></i>
      </a>
    </div>

    <!--  =====================================
         PASSWORD SHOW / HIDE
    ======================================  -->

    <script>
      const password = document.getElementById('password')
      
      const passwordToggle = document.getElementById('passwordToggle')
      
      passwordToggle.addEventListener('click', function () {
        const icon = this.querySelector('i')
      
        if (password.type === 'password') {
          password.type = 'text'
      
          icon.classList.remove('bi-eye')
      
          icon.classList.add('bi-eye-slash')
      
          this.setAttribute('aria-label', 'Hide password')
      
          this.classList.add('showing')
        } else {
          password.type = 'password'
      
          icon.classList.remove('bi-eye-slash')
      
          icon.classList.add('bi-eye')
      
          this.setAttribute('aria-label', 'Show password')
      
          this.classList.remove('showing')
        }
      })
    </script>
  </body>
</html>
