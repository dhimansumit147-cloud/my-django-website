{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Admin</title>


    <!-- =====================================
         FORGOT PASSWORD CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="{% static 'CSS/admin/forgot_password.css' %}">


    <!-- =====================================
         BOOTSTRAP ICONS
    ====================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

</head>


<body class="forgot-password-body">


    <!-- =====================================
         BACKGROUND DECORATION
    ====================================== -->

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>


    <!-- =====================================
         FORGOT PASSWORD CARD
    ====================================== -->

    <div class="forgot-password-box">


        <!-- =====================================
             TOP GRADIENT LINE
        ====================================== -->


        <div class="forgot-top-line"></div>


        <!-- =====================================
             LOGO
        ====================================== -->

        <img
            src="{% static 'image/logo.png' %}"
            class="forgot-password-logo"
            alt="Sungreen Logo">


        <!-- =====================================
             TITLE
        ====================================== -->

        <h2>
            Forgot Password?
        </h2>


        <!-- =====================================
             DESCRIPTION
        ====================================== -->

        <p class="forgot-description">

            Enter your registered email address
            and we'll send you a verification OTP.

        </p>


        <!-- =====================================
             FORGOT PASSWORD FORM
        ====================================== -->

        <form
            method="POST"
            autocomplete="off">

            {% csrf_token %}


            <!-- =================================
                 EMAIL
            ================================== -->

            <div class="forgot-input-box">

                <i class="bi bi-envelope"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Registered Email"
                    autocomplete="email"
                    required>

            </div>


            <!-- =================================
                 SEND OTP BUTTON
            ================================== -->

            <button
                type="submit"
                class="forgot-submit-btn">

                <i class="bi bi-send"></i>

                <span>
                    Send OTP
                </span>

            </button>


        </form>


        <!-- =====================================
             SUCCESS MESSAGE
        ====================================== -->

        {% if success %}

            <div class="success">

                <i class="bi bi-check-circle-fill"></i>

                <span>
                    {{ success }}
                </span>

            </div>

        {% endif %}


        <!-- =====================================
             ERROR MESSAGE
        ====================================== -->

        {% if error %}

            <div class="error">

                <i class="bi bi-exclamation-circle-fill"></i>

                <span>
                    {{ error }}
                </span>

            </div>

        {% endif %}


        <!-- =====================================
             BACK TO LOGIN
        ====================================== -->

        <a
            href="{% url 'admin-login' %}"
            class="forgot-back-login">

            <i class="bi bi-arrow-left"></i>

            <span>
                Back to Login
            </span>

        </a>


        <!-- =====================================
             VIEW WEBSITE
        ====================================== -->

        <a
            href="/"
            class="forgot-home">

            <i class="bi bi-globe2"></i>

            <span>
                View Website
            </span>

            <i class="bi bi-arrow-up-right"></i>

        </a>


    </div>


</body>

</html>
