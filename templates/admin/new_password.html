{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Password | Admin</title>

    <link
        rel="stylesheet"
        href="{% static 'CSS/admin/forgot_password.css' %}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

</head>


<body class="forgot-password-body">

    <div class="forgot-password-box">

        <img
            src="{% static 'image/logo.png' %}"
            class="forgot-password-logo"
            alt="Sungreen Logo">


        <h2>
            New Password
        </h2>


        {% if not success %}

            <p class="forgot-description">

                Create a new password for your
                admin account.

            </p>


            <form method="POST">

                {% csrf_token %}


                <!-- PASSWORD -->

                <div class="forgot-input-box">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="New Password"
                        autocomplete="new-password"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="forgot-input-box">

                    <i class="bi bi-lock-fill"></i>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        required>

                </div>


                <button type="submit">

                    <i class="bi bi-shield-check"></i>

                    <span>
                        Change Password
                    </span>

                </button>

            </form>

        {% endif %}


        {% if error %}

            <p class="error">

                <i class="bi bi-exclamation-circle"></i>

                {{ error }}

            </p>

        {% endif %}


        {% if success %}

            <p class="success">

                <i class="bi bi-check-circle"></i>

                {{ success }}

            </p>


            <a
                href="{% url 'admin-login' %}"
                class="forgot-back-login">

                <i class="bi bi-box-arrow-in-right"></i>

                <span>
                    Go to Login
                </span>

            </a>

        {% endif %}

    </div>

</body>

</html>
