{% extends 'admin/base.html' %}

{% load static %}


{% block css %}

<link
    rel="stylesheet"
    href="{% static 'CSS/admin/admin_slider.css' %}"
>

<style>

/
</style>

{% endblock %}



{% block content %}


<div class="slider-page">


    <!-- =====================================
         PAGE TITLE
    ====================================== -->

    <div class="page-title">

        <h2>
            Edit Slider
        </h2>

        <p>
            Update homepage slider banner
        </p>

    </div>



    <!-- =====================================
         EDIT FORM
    ====================================== -->

    <form
        action=""
        method="POST"
        enctype="multipart/form-data"
        class="slider-form"
    >

        {% csrf_token %}



        <!-- =====================================
             TITLE
        ====================================== -->

        <div class="form-group">

            <label>
                Slider Title
            </label>

            <input
                type="text"
                name="title"
                value="{{ slider.title }}"
                placeholder="Enter Slider Title"
                required
            >

        </div>



        <!-- =====================================
             SUBTITLE
        ====================================== -->

        <div class="form-group">

            <label>
                Slider Subtitle
            </label>

            <textarea
                name="subtitle"
                placeholder="Enter Slider Subtitle"
            >{{ slider.subtitle }}</textarea>

        </div>



        <!-- =====================================
             CURRENT IMAGE
        ====================================== -->

        <div class="form-group">

            <label>
                Current Slider Image
            </label>


            <div class="image-preview">

                {% if slider.image %}

                <img
                    id="imagePreview"
                    src="{{ slider.image.url }}"
                    alt="Slider Image"
                >

                {% endif %}

            </div>

        </div>



        <!-- =====================================
             NEW IMAGE
        ====================================== -->

        <div class="form-group">

            <label>
                Change Image (Optional)
            </label>


            <div class="file-upload">

                <i class="bi bi-image"></i>


                <input
                    type="file"
                    name="image"
                    id="imageInput"
                    accept="image/*"
                >


                <p id="fileName">
                    Choose a new image
                </p>

            </div>

        </div>



        <!-- =====================================
             BUTTON DETAILS
        ====================================== -->

        <div class="form-row">


            <!-- BUTTON TEXT -->

            <div class="form-group">

                <label>
                    Button Text
                </label>

                <input
                    type="text"
                    name="button_text"
                    value="{{ slider.button_text }}"
                    placeholder="Button Text"
                >

            </div>



            <!-- BUTTON LINK -->

            <div class="form-group">

                <label>
                    Button Link
                </label>

                <input
                    type="text"
                    name="button_link"
                    value="{{ slider.button_link }}"
                    placeholder="Button Link"
                >

            </div>


        </div>



        <!-- =====================================
             STATUS
        ====================================== -->

        <div class="form-group">

            <label>
                Slider Status
            </label>


            <div class="checkbox-area">

                <input
                    type="checkbox"
                    name="status"
                    value="1"
                    {% if slider.status %}checked{% endif %}
                >

                <span>
                    Active (Display on Home Page)
                </span>

            </div>

        </div>



        <!-- =====================================
             ACTION BUTTONS
        ====================================== -->

        <div class="form-actions">


            <!-- CANCEL -->

            <a
                href="/admin-slider/"
                class="cancel-btn"
            >

                <i class="bi bi-x-circle"></i>

                Cancel

            </a>



            <!-- UPDATE -->

            <button
                type="submit"
                class="save-btn"
            >

                <i class="bi bi-arrow-repeat"></i>

                Update Slider

            </button>


        </div>


    </form>

</div>



<!-- =========================================
     LIVE IMAGE PREVIEW
========================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const imageInput = document.getElementById("imageInput");

    const imagePreview = document.getElementById("imagePreview");

    const fileName = document.getElementById("fileName");


    if (!imageInput) {
        return;
    }


    imageInput.addEventListener("change", function () {

        const file = this.files[0];


        if (!file) {
            return;
        }


        /* CHECK IMAGE */

        if (!file.type.startsWith("image/")) {

            alert("Please select a valid image.");

            this.value = "";

            fileName.innerText = "Choose a new image";

            return;
        }


        /* SHOW FILE NAME */

        fileName.innerText = file.name;

        fileName.classList.add("selected-file");


        /* READ IMAGE */

        const reader = new FileReader();


        reader.onload = function (event) {

            /*
             * Agar current image already hai
             * to usi image ko replace karo
             */

            if (imagePreview) {

                imagePreview.src = event.target.result;

            }

        };


        reader.readAsDataURL(file);

    });

});

</script>


{% endblock %}
